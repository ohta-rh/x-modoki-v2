# CI is mandatory (ADR-0020). A change is done only when this workflow is green on its commit.
# The seven gates run in this order and the job stops at the first failure. Never add
# `continue-on-error`, skip a gate, or lower a threshold to get green (.claude/rules/quality-gates.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (7 gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORT: '3000'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Services (PostgreSQL, Garage) and .env.local
        run: sh scripts/setup-local.sh
      # The app's own database needs the tables too: pnpm start serves the browser tests from it
      # (Vitest builds its own databases). Same order as docs/architecture/environments.md.
      - name: Database migrations
        run: pnpm db:migrate
      # Browsers are cached; their system packages come from apt, whose mirror sometimes stalls for
      # many minutes (#43). Each apt attempt is capped at 200 seconds (by a root timeout) and retried; downloaded .deb files are kept.
      - name: Playwright browsers (cache)
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install chromium firefox webkit
      # The .deb files of the browsers' system packages are cached too, so a run with a cache hit
      # never talks to the apt mirror, which can be slow for longer than any retry (#45).
      # The runner image is rebuilt about weekly; a new image must miss the cache so it is saved
      # again (actions/cache never saves on a primary-key hit).
      - name: Runner image
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Playwright system packages (cache)
        id: debs-cache
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: playwright-debs-${{ steps.image.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Playwright system packages
        timeout-minutes: 15
        run: |
          if [ "${{ steps.debs-cache.outputs.cache-hit }}" = "true" ] && sudo dpkg -i ~/apt-debs/*.deb; then
            exit 0
          fi
          sudo dpkg --configure -a || true
          for attempt in 1 2 3; do
            # timeout runs as root so it can stop the root apt-get that Playwright starts (#44).
            if sudo --preserve-env=PATH timeout -k 15 200 "$(command -v pnpm)" exec playwright install-deps chromium firefox webkit; then
              mkdir -p ~/apt-debs
              find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp {} ~/apt-debs/ \;
              exit 0
            fi
            echo "attempt $attempt did not finish in 200 seconds; retrying"
            # A cap that fires mid-install leaves dpkg half done; finish it before the next attempt.
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: 1. Documentation (OKF bundle, links, ADRs, test reports)
        run: pnpm docs:check
      - name: 2. Type check
        run: pnpm typecheck
      - name: 3. Lint (ESLint, Steiger, src layers)
        run: pnpm lint
      - name: 4. Format
        run: pnpm format:check
      - name: 5. Tests and coverage (100%)
        run: pnpm test --coverage
      - name: 6. Build
        run: pnpm build
      - name: 7. Browser tests (Chromium, Firefox, WebKit)
        run: pnpm test:e2e

      - name: Keep screenshots and traces of a browser-test failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
